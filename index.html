<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#2e7d32">
  <meta name="description" content="Generator demonstracyjnych paragonów">
  <link rel="manifest" href="./manifest.json">
  <link rel="icon" href="./icon-192.png" type="image/png">

<title>Generator paragonów</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<style>
  :root {
    --paper-width: 320px;
  }
  * { box-sizing: border-box; }
  body {
    font-family: 'Courier New', monospace;
    background: #e9e9e9;
    margin: 0;
    padding: 12px;
    display: flex;
    gap: 30px;
    flex-wrap: wrap;
    justify-content: center;
    align-items: flex-start;
  }
  .panel {
    background: #fff;
    border-radius: 8px;
    padding: 20px;
    width: min(380px, 100%);
    box-shadow: 0 1px 4px rgba(0,0,0,0.15);
  }
  .panel h2 {
    font-family: Arial, sans-serif;
    font-size: 26px;
    margin-top: 0;
  }
  label {
    display: block;
    font-family: Arial, sans-serif;
    font-size: 22px;
    color: #333;
    margin-top: 10px;
    margin-bottom: 3px;
  }
  select { width: 100%; padding: 6px 8px; font-family: Arial, sans-serif; font-size: 24px; border: 1px solid #ccc; border-radius: 4px; background: #fff; }
  .hint { font-family: Arial, sans-serif; font-size: 18px; color: #777; margin-top: 2px; }
  input, textarea {
    width: 100%;
    padding: 6px 8px;
    font-family: Arial, sans-serif;
    font-size: 24px;
    border: 1px solid #ccc;
    border-radius: 4px;
  }
  .item-row {
    display: grid;
    grid-template-columns: 1fr 52px 70px 62px 30px;
    gap: 6px;
    margin-top: 6px;
    align-items: center;
  }
  .item-row input { padding: 5px; font-size: 25px; }
  button {
    font-family: Arial, sans-serif;
    cursor: pointer;
    border: none;
    border-radius: 4px;
    padding: 8px 12px;
    font-size: 26px;
    margin-top: 10px;
  }
  .btn-add { background: #eee; color: #333; }
  .btn-remove { background: #f4d4d4; color: #900; padding: 4px 8px; font-size: 23px; }
  .btn-print { background: #2e7d32; color: #fff; width: 100%; font-size: 25px; padding: 10px; margin-top: 16px; }
  .btn-export { color: #fff; width: 100%; font-size: 24px; padding: 9px; margin-top: 8px; }
  .btn-pdf { background: #c62828; }
  .btn-jpg { background: #1565c0; }
  .export-status { font-family: Arial, sans-serif; font-size: 22px; color: #666; text-align: center; margin-top: 4px; min-height: 14px; }
  .vat-row { display: grid; grid-template-columns: 1fr 60px 30px; gap: 6px; margin-top: 6px; }

  /* --- RECEIPT --- */
  #receipt-wrapper {
    width: var(--paper-width);
    background: #fff;
    padding: 14px 16px 30px;
    box-shadow: 0 1px 6px rgba(0,0,0,0.2);
    font-family: 'Courier New', monospace;
    font-size: 21.5px;
    line-height: 1.35;
    color: #111;
  }
  #receipt-wrapper .center { text-align: center; }
  #receipt-wrapper .bold { font-weight: bold; }
  #receipt-wrapper .big { font-size: 25px; font-weight: bold; }
  #receipt-wrapper hr {
    border: none;
    border-top: 1px dashed #444;
    margin: 6px 0;
  }
  #receipt-wrapper .line {
    display: flex;
    justify-content: space-between;
    white-space: pre;
  }
  #receipt-wrapper .item-name {
    white-space: normal;
  }
  #receipt-wrapper .qty-line {
    display: flex;
    justify-content: flex-end;
    gap: 10px;
  }
  #receipt-wrapper .totals .line { font-size: 22px; }
  #receipt-wrapper .suma {
    font-size: 27px;
    font-weight: bold;
    display: flex;
    justify-content: space-between;
    margin-top: 4px;
  }
  #receipt-wrapper .demo { font-size: 16px; text-align: center; margin-top: 12px; border-top: 1px dashed #444; padding-top: 6px; }
  #receipt-wrapper .one-line { display: flex; justify-content: space-between; gap: 6px; }
  #receipt-wrapper .one-line .nm { flex: 1; min-width: 0; overflow-wrap: anywhere; }
  #receipt-wrapper .right { text-align: right; }
  #receipt-wrapper .small-note {
    font-size: 20px;
    text-align: center;
    margin-top: 10px;
  }

  @media (max-width: 420px) {
    body { padding: 8px; gap: 14px; }
    .panel { padding: 14px; }
    #receipt-wrapper { max-width: 100%; }
    .item-row { grid-template-columns: minmax(0, 1fr) 44px 58px 52px 28px; gap: 3px; }
  }

  @media print {
    body * { visibility: hidden; }
    #receipt-wrapper, #receipt-wrapper * { visibility: visible; }
    #receipt-wrapper {
      position: absolute;
      top: 0; left: 0;
      box-shadow: none;
      width: 80mm;
    }
    .panel, .btn-print { display: none; }
  }
</style>
</head>
<body>

<div class="panel">
  <h2>Szablon</h2>
  <select id="template">
    <option value="classic">Klasyczny (obecny)</option>
    <option value="detailed">Szczegółowy (obniżki, karta)</option>
    <option value="oneline">Jednoliniowy (gotówka, reszta)</option>
  </select>

  <h2 style="margin-top:20px;">Dane sprzedawcy</h2>
  <label>Nazwa firmy</label>
  <input id="storeName" value="MOJA FIRMA SP. Z O.O.">
  <label>Adres (linia 1)</label>
  <input id="addr1" value="UL. PRZYKŁADOWA 1">
  <label>Adres (linia 2)</label>
  <input id="addr2" value="00-000 MIASTO">
  <label>NIP</label>
  <input id="nip" value="000-000-00-00">
  <label>Sprzedawca</label>
  <input id="sellerName" value="Jan Kowalski">
  <label>Nr kasy</label>
  <input id="registerNo" value="1">
  <label>Nr kasjera</label>
  <input id="cashierNo" value="1">

  <h2 style="margin-top:20px;">Rachunek</h2>
  <label>Numer rachunku</label>
  <input id="receiptNo" value="1">
  <label>Nr transakcji</label>
  <input id="txnNo" value="0001">
  <label>Data i godzina</label>
  <input id="dateTime" type="datetime-local">

  <h2 style="margin-top:20px;">Pozycje</h2>
  <div id="items"></div>
  <button class="btn-add" onclick="addItem()">+ Dodaj pozycję</button>

  <h2 style="margin-top:20px;">Stawka VAT</h2>
  <label>Stawka VAT (%)</label>
  <input id="vatRate" value="23" type="number">

  <label>Sposób płatności</label>
  <input id="payMethod" value="GOTÓWKA">
  <label>Wpłacono gotówką (opcjonalnie)</label>
  <input id="cashGiven" type="number" step="0.01" placeholder="np. 150">
  <div class="hint">Jeśli wyższe niż suma, pokaże resztę.</div>

  <button class="btn-print" onclick="window.print()">🖨️ Drukuj rachunek</button>
  <button class="btn-export btn-pdf" onclick="saveAsPDF()">📄 Zapisz jako PDF</button>
  <button class="btn-export btn-jpg" onclick="saveAsJPG()">🖼️ Zapisz jako JPG</button>
  <div class="export-status" id="exportStatus"></div>
</div>

<div id="receipt-wrapper"></div>

<script>
let items = [
  { name: "Produkt przykładowy", qty: 1, price: 100.00, discount: 0 }
];

function esc(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderItemInputs() {
  const container = document.getElementById('items');
  container.innerHTML = '';
  items.forEach((item, idx) => {
    const row = document.createElement('div');
    row.className = 'item-row';
    row.innerHTML = `
      <input type="text" value="${esc(item.name)}" oninput="updateItem(${idx}, 'name', this.value)" placeholder="Nazwa">
      <input type="number" value="${item.qty}" step="1" oninput="updateItem(${idx}, 'qty', this.value)" placeholder="Ilość">
      <input type="number" value="${item.price}" step="0.01" oninput="updateItem(${idx}, 'price', this.value)" placeholder="Cena">
      <input type="number" value="${item.discount || ''}" step="0.01" min="0" oninput="updateItem(${idx}, 'discount', this.value)" placeholder="Rabat">
      <button class="btn-remove" onclick="removeItem(${idx})">✕</button>
    `;
    container.appendChild(row);
  });
}

function addItem() {
  items.push({ name: "", qty: 1, price: 0, discount: 0 });
  renderItemInputs();
  renderReceipt();
}

function removeItem(idx) {
  items.splice(idx, 1);
  renderItemInputs();
  renderReceipt();
}

function updateItem(idx, field, value) {
  if (field === 'qty' || field === 'price' || field === 'discount') {
    items[idx][field] = parseFloat(value) || 0;
  } else {
    items[idx][field] = value;
  }
  renderReceipt();
}

function fmt(n) {
  return n.toFixed(2).replace('.', ',');
}

const DEMO_LINE = 'DOKUMENT DEMONSTRACYJNY – NIE JEST PARAGONEM FISKALNYM';

function renderReceipt() {
  const val = id => document.getElementById(id).value;
  const tpl = val('template');
  const storeName = esc(val('storeName'));
  const addr1 = esc(val('addr1'));
  const addr2 = esc(val('addr2'));
  const nip = esc(val('nip'));
  const seller = esc(val('sellerName'));
  const registerNo = esc(val('registerNo'));
  const cashierNo = esc(val('cashierNo'));
  const receiptNo = esc(val('receiptNo'));
  const txnNo = esc(val('txnNo'));
  const vatRate = parseFloat(val('vatRate')) || 0;
  const payMethod = esc(val('payMethod'));
  const cashGiven = parseFloat(val('cashGiven')) || 0;

  const d = val('dateTime') ? new Date(val('dateTime')) : new Date();
  const dateStr = d.toLocaleDateString('pl-PL');
  const timeStr = d.toLocaleTimeString('pl-PL', {hour: '2-digit', minute: '2-digit'});

  let total = 0, totalDiscount = 0;
  items.forEach(it => {
    const disc = Math.min(it.discount || 0, it.qty * it.price);
    it._disc = disc;
    it._line = it.qty * it.price - disc;
    total += it._line;
    totalDiscount += disc;
  });
  const vatAmount = total - total / (1 + vatRate / 100);
  const change = cashGiven > 0 ? cashGiven - total : 0;

  const header = `
    <div class="center bold">${storeName}</div>
    <div class="center">${addr1}</div>
    <div class="center">${addr2}</div>
    <div class="center">NIP: ${nip}</div>
    <hr>`;
  const footer = `<div class="demo">${DEMO_LINE}</div>`;

  const vatBlock = `
    <div class="line"><span>SPRZEDAŻ OPODATKOWANA A</span></div>
    <div class="line"><span></span><span>${fmt(total)}</span></div>
    <div class="line"><span>PTU A ${fmt(vatRate)} %</span><span>${fmt(vatAmount)}</span></div>
    <div class="line"><span>SUMA PTU</span><span>${fmt(vatAmount)}</span></div>`;

  let html = '';

  if (tpl === 'classic') {
    let itemsHtml = '';
    items.forEach(it => {
      itemsHtml += `
        <div class="item-name">${esc(it.name) || '—'}</div>
        <div class="qty-line"><span>${it.qty} x ${fmt(it.price)}</span><span class="bold">${fmt(it._line)}A</span></div>
        ${it._disc ? `<div class="qty-line"><span>OBNIŻKA</span><span>-${fmt(it._disc)}</span></div>` : ''}`;
    });
    html = `
      ${header}
      <div class="center">${dateStr} ${timeStr}</div>
      <div class="center big">RACHUNEK</div>
      <hr>
      ${itemsHtml}
      <hr>
      ${vatBlock}
      <div class="suma"><span>SUMA PLN</span><span>${fmt(total)}</span></div>
      <hr>
      <div class="line"><span>Nr rachunku #</span><span>${receiptNo}</span></div>
      <div class="line"><span>${payMethod}</span><span>${fmt(total)} PLN</span></div>
      <div class="small-note">Dziękujemy za zakupy</div>
      ${footer}`;
  }

  if (tpl === 'detailed') {
    let itemsHtml = '';
    items.forEach(it => {
      itemsHtml += `
        <div class="item-name">${esc(it.name) || '—'}</div>
        <div class="line"><span>${it.qty} x ${fmt(it.price)}</span><span class="bold">${fmt(it.qty * it.price)}A</span></div>
        ${it._disc ? `<div class="line"><span>OBNIŻKA</span><span>-${fmt(it._disc)}</span></div>` : ''}`;
    });
    html = `
      <div class="center bold">${storeName}</div>
      <div class="center">${addr1}, ${addr2}</div>
      <div class="center">NIP: ${nip}</div>
      <hr>
      <div class="center big">RACHUNEK</div>
      <hr>
      ${itemsHtml}
      <hr>
      ${totalDiscount ? `<div class="line"><span>Suma obniżek:</span><span>${fmt(totalDiscount)}</span></div>` : ''}
      ${vatBlock}
      <div class="suma"><span>SUMA:</span><span>PLN ${fmt(total)}</span></div>
      <div class="suma" style="font-size:23px"><span>DO ZAPŁATY:</span><span>${fmt(total)}</span></div>
      <hr>
      <div class="center">ROZLICZENIE PŁATNOŚCI</div>
      <div class="line"><span>${payMethod}:</span><span>${fmt(total)}</span></div>
      ${cashGiven > 0 && change >= 0 ? `<div class="line"><span>Wpłacono:</span><span>${fmt(cashGiven)}</span></div><div class="line"><span>Reszta:</span><span>${fmt(change)}</span></div>` : ''}
      <hr>
      <div class="line"><span>#Kasa ${registerNo} Kasjer nr ${cashierNo}</span></div>
      <div class="line"><span>${dateStr} ${timeStr}</span></div>
      <div class="line"><span>Sprzedawca:</span><span>${seller}</span></div>
      <div class="line"><span>Nr rachunku:</span><span>${receiptNo}</span></div>
      <div class="line"><span>Nr transakcji:</span><span>${txnNo}</span></div>
      ${footer}`;
  }

  if (tpl === 'oneline') {
    let itemsHtml = '';
    items.forEach(it => {
      itemsHtml += `
        <div class="one-line"><span class="nm">${esc(it.name) || '—'}</span><span>${it.qty} x ${fmt(it.price)}</span><span class="bold">${fmt(it.qty * it.price)}A</span></div>
        ${it._disc ? `<div class="one-line"><span class="nm">OBNIŻKA</span><span>-${fmt(it._disc)}</span></div>` : ''}`;
    });
    html = `
      <div class="center bold">${storeName}</div>
      <div class="center">${addr1} ${addr2}</div>
      <div class="center">NIP: ${nip}</div>
      <div class="center big">RACHUNEK</div>
      <hr>
      ${itemsHtml}
      <hr>
      <div class="line"><span>Sprzedaż opodatkowana A:</span><span>${fmt(total)}</span></div>
      <div class="line"><span>Kwota PTU A ${fmt(vatRate)}%</span><span>${fmt(vatAmount)}</span></div>
      <div class="line"><span>SUMA PTU</span><span>${fmt(vatAmount)}</span></div>
      <div class="suma"><span>SUMA:</span><span>PLN ${fmt(total)}</span></div>
      <div class="suma" style="font-size:23px"><span>DO ZAPŁATY:</span><span>${fmt(total)}</span></div>
      <div class="center">ROZLICZENIE PŁATNOŚCI</div>
      <div class="line"><span>${payMethod}:</span><span>${cashGiven > 0 ? fmt(cashGiven) : fmt(total)}</span></div>
      ${cashGiven > 0 && change >= 0 ? `<div class="line"><span>Reszta:</span><span>${fmt(change)}</span></div>` : ''}
      <hr>
      <div class="line"><span>#Kasa ${registerNo} Kasjer nr ${cashierNo}</span></div>
      <div class="right">${dateStr} ${timeStr}</div>
      <div class="line"><span>Sprzedawca:</span><span>${seller}</span></div>
      <div class="line"><span>Nr rachunku:</span><span>${receiptNo}</span></div>
      <div class="line"><span>Nr transakcji:</span><span>${txnNo}</span></div>
      ${footer}`;
  }

  document.getElementById('receipt-wrapper').innerHTML = html;
}

// Init
document.getElementById('dateTime').value = new Date().toISOString().slice(0,16);
renderItemInputs();
renderReceipt();

document.querySelectorAll('#storeName, #addr1, #addr2, #nip, #sellerName, #registerNo, #cashierNo, #receiptNo, #txnNo, #dateTime, #vatRate, #payMethod, #cashGiven')
  .forEach(el => el.addEventListener('input', renderReceipt));

const tplSel = document.getElementById('template');
try { const saved = localStorage.getItem('receiptTemplate'); if (saved) tplSel.value = saved; } catch (e) {}
tplSel.addEventListener('change', () => {
  try { localStorage.setItem('receiptTemplate', tplSel.value); } catch (e) {}
  renderReceipt();
});
renderReceipt();

function setStatus(msg) {
  document.getElementById('exportStatus').textContent = msg;
  setTimeout(() => { document.getElementById('exportStatus').textContent = ''; }, 3000);
}

function filenameBase() {
  const no = document.getElementById('receiptNo').value || 'rachunek';
  return 'rachunek_' + String(no).replace(/[^a-zA-Z0-9_-]/g, '');
}

async function captureReceipt() {
  const node = document.getElementById('receipt-wrapper');
  return await html2canvas(node, {
    scale: 3,
    backgroundColor: '#ffffff',
    useCORS: true
  });
}

async function saveAsJPG() {
  setStatus('Generowanie JPG...');
  try {
    const canvas = await captureReceipt();
    const link = document.createElement('a');
    link.download = filenameBase() + '.jpg';
    link.href = canvas.toDataURL('image/jpeg', 0.95);
    link.click();
    setStatus('Zapisano JPG ✓');
  } catch (err) {
    console.error(err);
    setStatus('Błąd podczas zapisu JPG');
  }
}

async function saveAsPDF() {
  setStatus('Generowanie PDF...');
  try {
    const canvas = await captureReceipt();
    const imgData = canvas.toDataURL('image/jpeg', 0.95);

    const { jsPDF } = window.jspdf;
    // Receipt paper width ~80mm, height scales to content
    const pdfWidthMM = 80;
    const pdfHeightMM = (canvas.height * pdfWidthMM) / canvas.width;

    const pdf = new jsPDF({
      orientation: 'portrait',
      unit: 'mm',
      format: [pdfWidthMM, pdfHeightMM]
    });
    pdf.addImage(imgData, 'JPEG', 0, 0, pdfWidthMM, pdfHeightMM);
    pdf.save(filenameBase() + '.pdf');
    setStatus('Zapisano PDF ✓');
  } catch (err) {
    console.error(err);
    setStatus('Błąd podczas zapisu PDF');
  }
}
</script>

<script>
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("./service-worker.js").catch(console.error);
    });
  }
</script>
</body>
</html>
